<text x="790" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#41379A">VPN</text>
<rect x="741.4" y="334" width="97.2" height="20" rx="4" fill="#F1F3F5" stroke="#B8BEC6" stroke-width="1"/>
<text x="790" y="348" text-anchor="middle" font-size="11" fill="#333">10.10.10.0/24</text>
<rect x="690" y="364" width="200" height="100" rx="8" fill="#ffffff" stroke="#5B4FB8" stroke-width="1.5"/>
<text x="790" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">WireGuard tunnel</text>
