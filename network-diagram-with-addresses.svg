<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 712" width="960" height="712" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="960" height="712" fill="#ffffff"/>
<text x="480.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3A5F">Home Network Lab: Network Diagram</text>
<text x="480.0" y="56" text-anchor="middle" font-size="13" fill="#555">pfSense firewall with three zones (LAN, DMZ, VPN) across 10+ devices on repurposed hardware</text>
<ellipse cx="480" cy="110" rx="95" ry="30" fill="#EEF2F7" stroke="#7A8AA0" stroke-width="2"/>
