<text x="548" y="565" text-anchor="middle" font-size="11" fill="#555">restore tested</text>
<rect x="499.4" y="580" width="97.2" height="20" rx="4" fill="#F1F3F5" stroke="#B8BEC6" stroke-width="1"/>
