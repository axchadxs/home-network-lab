<text x="412" y="565" text-anchor="middle" font-size="11" fill="#555">DNS filtering</text>
<rect x="366.6" y="580" width="90.80000000000001" height="20" rx="4" fill="#F1F3F5" stroke="#B8BEC6" stroke-width="1"/>
