<text x="480" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">pfSense firewall / router</text>
<text x="480" y="226" text-anchor="middle" font-size="12" fill="#DCE6F2">firewall rules per zone  |  WireGuard VPN</text>
