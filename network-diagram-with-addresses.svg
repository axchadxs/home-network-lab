<text x="790" y="422" text-anchor="middle" font-size="11" fill="#555">enabled when needed</text>
<rect x="754.2" y="440" width="71.6" height="20" rx="4" fill="#F1F3F5" stroke="#B8BEC6" stroke-width="1"/>
<text x="790" y="454" text-anchor="middle" font-size="11" fill="#333">UDP 51820</text>
<text x="790" y="586" text-anchor="middle" font-size="11" fill="#777">DNS from Pi-hole</text>
<text x="40" y="642" text-anchor="start" font-size="12" fill="#555">DNS for all three zones is provided by Pi-hole</text>
<line x1="440" y1="638" x2="476" y2="638" stroke="#444" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="486" y="642" text-anchor="start" font-size="12" fill="#555">traffic between zones passes through pfSense</text>
<text x="40" y="666" text-anchor="start" font-size="12" fill="#555">The home Wi-Fi router is separate and not part of the lab</text>
<text x="40" y="688" text-anchor="start" font-size="12" fill="#555">Addressing shown is illustrative and does not reflect the real network.</text>
